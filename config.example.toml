# emcipi – example configuration
# Default path: $XDG_CONFIG_HOME/emcipi/config.toml (else ~/.config/emcipi/config.toml),
# on Windows %APPDATA%\emcipi\config.toml.
# Override with `--config <path>` or EMCIPI_CONFIG.
#
# Keep secrets out of this file. Placeholders in command/args/env/cwd/url/headers and
# http.auth_token are resolved on every (re)connect, so rotating tokens work:
#   ${VAR}  ${env:VAR}       environment variable (error if unset)
#   ${VAR:-default}          with fallback (also used if the value is empty)
#   ${file:path}             file contents; ~/ and paths relative to this file
#   ${cmd:program args}      stdout of the program (30 s timeout), started directly
#                            without a shell: same behavior on Linux, macOS, Windows.
#                            Quoting: '...' literal, "..." with \" and \\.
#                            Shell only when called explicitly: ${cmd:sh -c '... | ...'}
#   $${                      a literal "${"
# Trailing whitespace/newlines of file and cmd output are removed.

# Default mode for servers without their own `mode`.
# Override with `--mode` / EMCIPI_MODE.
#   "static":  every tool is listed directly as <server>__<tool> (default)
#   "dynamic": only the meta tools search_tools / describe_tools / call_tool
mode = "static"

separator = "__"
startup_timeout_secs = 30   # max. time for spawn + initialize of an upstream
tool_timeout_secs = 300     # max. duration of a tool call

# Stop stdio servers after this many seconds without a call (0/unset = never).
# The next call starts them again; their tool list stays cached.
# Override with `--idle-timeout` / EMCIPI_IDLE_TIMEOUT.
idle_timeout_secs = 600

[http]
listen = "127.0.0.1:8808"   # or --listen / EMCIPI_LISTEN
path = "/mcp"               # plus /mcp/static and /mcp/dynamic
# allowed_hosts = ["localhost", "127.0.0.1", "my-host.lan"]  # default: loopback only
# Token for inbound requests; prefer setting EMCIPI_AUTH_TOKEN
# auth_token = "${cmd:security find-generic-password -s emcipi -w}"

# --- stdio upstreams ------------------------------------------------------------
[servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
# By default servers only see a base environment (PATH, HOME, locale, proxy, ...)
# plus their own `env`. Pass secrets explicitly, e.g. from a secret manager:
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${cmd:gh auth token}" }
description = "GitHub: issues, pull requests, repositories, code search"
mode = "dynamic"             # many tools: search only, even with --mode static
exclude_tools = ["delete_*"]

[servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "${HOME}/projects"]
description = "Read and write files under ~/projects"
mode = "static"              # always listed directly, even with --mode dynamic
idle_timeout_secs = 0        # never stop
inherit_env = true           # sees the gateway's whole environment
include_tools = ["read_*", "list_*", "search_files"]

# --- Streamable HTTP upstreams --------------------------------------------------
[servers.context7]
url = "https://mcp.context7.com/mcp"
headers = { CONTEXT7_API_KEY = "${file:~/.config/emcipi/secrets/context7}" }
description = "Up-to-date library documentation"

[servers.internal]
url = "https://mcp.example.com/mcp"
headers = { Authorization = "Bearer ${cmd:op read op://Private/internal-mcp/token}" }
description = "Internal tools"

# OAuth: HTTP servers without an Authorization header sign in with
# `emcipi login <server>`; tokens are stored outside this file and refreshed.
[servers.sentry]
url = "https://mcp.sentry.dev/mcp"
description = "Sentry issues and events"
# Only for servers without dynamic client registration:
# oauth = { client_id = "my-client", client_secret = "${cmd:op read op://Private/sentry/secret}", scopes = ["read"], callback_port = 8765 }

[servers.experimental]
enabled = false
command = "./my-server"
cwd = "~/dev/my-server"
